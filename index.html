<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Scorio — Live Scores &amp; Tournament Management</title>
    <meta name="description" content="Scorio: run tournaments, score matches ball-by-ball, and publish live scores and a branded tournament website in minutes." />
    <meta name="theme-color" content="#0A0F1D" />
    <meta property="og:title" content="Scorio — Live Scores &amp; Tournament Management" />
    <meta property="og:description" content="Run tournaments, score matches ball-by-ball, and publish live scores in minutes." />
    <meta property="og:type" content="website" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Apply the saved (or default dark) theme before first paint so there is no light flash. -->
    <script>
      try {
        var t = localStorage.getItem("scorio-theme") || localStorage.getItem("tournamentlive-theme");
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      } catch (e) {}
    </script>
    <style>
      html { background: #0A0F1D; }
      html[data-theme="light"] { background: #F4F6FA; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
